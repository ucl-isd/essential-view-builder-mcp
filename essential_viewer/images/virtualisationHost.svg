<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass_shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8EAED; stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#BDC1C6; stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="vm_blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4" />
      <stop offset="100%" style="stop-color:#174EA6" />
    </linearGradient>
    
    <filter id="inner_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 20)">
    <path d="M250 320 L400 250 V320 L250 390 Z" fill="#9AA0A6" />
    <path d="M250 320 L100 250 V320 L250 390 Z" fill="#80868B" />
    <path d="M250 320 L400 250 L250 180 L100 250 Z" fill="#DADCE0" />

    <path d="M250 280 L370 225 L250 170 L130 225 Z" fill="url(#vm_blue)" opacity="0.9" />
    
    <path d="M250 240 L370 185 L250 130 L130 185 Z" fill="#34A853" opacity="0.8" />
    
    <path d="M250 200 L370 145 L250 90 L130 145 Z" fill="#FBBC04" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite" />
    </path>

    <path d="M250 120 L420 40 V300 L250 380 Z" fill="url(#glass_shell)" stroke="#FFFFFF" stroke-opacity="0.3" />
    <path d="M250 120 L80 40 V300 L250 380 Z" fill="rgba(255,255,255,0.1)" stroke="#FFFFFF" stroke-opacity="0.2" />
    <path d="M250 120 L420 40 L250 -40 L80 40 Z" fill="rgba(255,255,255,0.2)" stroke="#FFFFFF" stroke-opacity="0.4" />

    <circle cx="250" cy="350" r="5" fill="#EA4335" filter="url(#inner_glow)">
       <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>