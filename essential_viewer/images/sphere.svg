<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sphereGradient" cx="40%" cy="30%" r="50%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="100%" stop-color="#d3d3d3" />
    </radialGradient>

    <radialGradient id="shadowGradient">
      <stop offset="0%" stop-color="rgba(0,0,0,0.5)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <clipPath id="shadowClip">
      <rect x="0" y="0" width="200" height="200" />
    </clipPath>
  </defs>

  <ellipse cx="100" cy="180" rx="60" ry="15" fill="url(#shadowGradient)" clip-path="url(#shadowClip)" />

  <circle cx="100" cy="100" r="80" fill="url(#sphereGradient)" />
</svg>